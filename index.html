<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AR Finger Ruler</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; }
  #camerafeed {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    display: block; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #hint {
    position: absolute; top: 24px; left: 0; right: 0; text-align: center;
    color: #fff; font-family: -apple-system, sans-serif; font-size: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,.9); z-index: 10; pointer-events: none;
  }
  #start-overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #start-button {
    font-family: -apple-system, sans-serif; font-size: 18px; font-weight: 600;
    color: #000; background: #00ff88; border: none; border-radius: 12px;
    padding: 16px 32px;
  }
</style>
</head>
<body>
  <canvas id="camerafeed"></canvas>
  <div id="hint">Drag your finger across a real surface to measure it</div>
  <div id="start-overlay">
    <button id="start-button">Tap to Start AR</button>
  </div>

  <!-- three.js must be loaded (and window.THREE set) before the engine's ThreeJS pipeline module runs. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- 8th Wall open-source engine. No account/appKey needed since the Feb 2026 open-source transition. -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>

  <script>
  const WORKER_URL = 'https://ar-ruler-measure.royr.workers.dev'
  const DEFAULT_HINT = 'Drag your finger across a real surface to measure it'

  // A full-resolution phone capture (1000+ px, high devicePixelRatio) costs enough vision
  // tokens on its own to blow Groq's free-tier per-minute budget for a single request.
  // Downscaling before sending keeps token usage small and predictable regardless of
  // device resolution.
  const captureDownscaledImage = (sourceCanvas, maxDimension) => {
    const scale = Math.min(1, maxDimension / Math.max(sourceCanvas.width, sourceCanvas.height))
    const outW = Math.round(sourceCanvas.width * scale)
    const outH = Math.round(sourceCanvas.height * scale)
    const outCanvas = document.createElement('canvas')
    outCanvas.width = outW
    outCanvas.height = outH
    outCanvas.getContext('2d').drawImage(sourceCanvas, 0, 0, outW, outH)
    return outCanvas.toDataURL('image/jpeg', 0.6)
  }

  const setHint = (text, revertAfterMs) => {
    const hintEl = document.getElementById('hint')
    hintEl.textContent = text
    clearTimeout(setHint._timer)
    if (revertAfterMs) {
      setHint._timer = setTimeout(() => { hintEl.textContent = DEFAULT_HINT }, revertAfterMs)
    }
  }

  const rulerPipelineModule = () => {
    let scene, camera, renderer
    let activeLine = null
    let activePoints = []
    const finishedGroup = new THREE.Group()

    // Set by onTouchEnd, run from onRender so the canvas is captured at the right moment
    // in the frame — toDataURL() on a WebGL canvas is unreliable outside that window
    // because the browser can clear the drawing buffer right after each frame presents.
    let pendingCapture = null

    // Raycast a screen point against 8th Wall's real-world surface tracking.
    // x, y are normalized [0,1], (0,0) = top-left, (1,1) = bottom-right of the camera feed.
    // Returns a THREE.Vector3 in meters, or null if nothing was hit under that point.
    const hitTestScreenPoint = (clientX, clientY) => {
      const x = clientX / window.innerWidth
      const y = clientY / window.innerHeight
      const hits = XR8.XrController.hitTest(x, y, ['FEATURE_POINT'])
      if (hits && hits.length > 0) {
        const { position } = hits[0]
        return new THREE.Vector3(position.x, position.y, position.z)
      }
      return null
    }

    // WebGL ignores THREE.LineBasicMaterial's linewidth on almost every platform (including
    // Safari/iOS), so a visibly thicker line has to be built as real geometry instead.
    // TubeGeometry (Frenet frames) was tried and rejected: it's numerically unstable for
    // near-straight paths — exactly what a measuring line is — and can throw vertices way
    // off. Camera-facing billboard quads per segment have no such failure mode.
    const LINE_WIDTH = 0.004 // meters
    const WORLD_UP = new THREE.Vector3(0, 1, 0)

    const makeLine = () => new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide }))

    const updateLineGeometry = (line, points) => {
      if (points.length < 2) return
      const positions = []
      for (let i = 0; i < points.length - 1; i++) {
        const a = points[i]
        const b = points[i + 1]
        const segDir = new THREE.Vector3().subVectors(b, a)
        if (segDir.lengthSq() < 1e-10) continue
        segDir.normalize()

        // Using a fixed world-up reference (instead of the per-point camera direction)
        // keeps the ribbon's width direction consistent segment-to-segment. The previous
        // per-segment view-relative version flipped sides unpredictably as the path
        // curved, turning the line into a zigzagging filled blob instead of a clean strip.
        let side = new THREE.Vector3().crossVectors(segDir, WORLD_UP)
        if (side.lengthSq() < 1e-6) {
          // Segment is nearly vertical (parallel to world up) — WORLD_UP fallback only.
          const viewDir = new THREE.Vector3().subVectors(camera.position, a).normalize()
          side.crossVectors(segDir, viewDir)
        }
        side.normalize().multiplyScalar(LINE_WIDTH / 2)

        const a0 = new THREE.Vector3().addVectors(a, side)
        const a1 = new THREE.Vector3().subVectors(a, side)
        const b0 = new THREE.Vector3().addVectors(b, side)
        const b1 = new THREE.Vector3().subVectors(b, side)

        positions.push(
          a0.x, a0.y, a0.z, b0.x, b0.y, b0.z, a1.x, a1.y, a1.z,
          a1.x, a1.y, a1.z, b0.x, b0.y, b0.z, b1.x, b1.y, b1.z,
        )
      }
      line.geometry.dispose()
      line.geometry = new THREE.BufferGeometry()
      line.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3))
    }

    const makeTextSprite = (text) => {
      const canvas = document.createElement('canvas')
      const ctx = canvas.getContext('2d')
      const fontSize = 64
      ctx.font = `bold ${fontSize}px sans-serif`
      const padding = 24
      const textWidth = ctx.measureText(text).width
      canvas.width = textWidth + padding * 2
      canvas.height = fontSize + padding * 2

      ctx.font = `bold ${fontSize}px sans-serif`
      ctx.fillStyle = 'rgba(0,0,0,0.55)'
      ctx.fillRect(0, 0, canvas.width, canvas.height)
      ctx.fillStyle = '#00ff88'
      ctx.textBaseline = 'middle'
      ctx.fillText(text, padding, canvas.height / 2)

      const texture = new THREE.CanvasTexture(canvas)
      const material = new THREE.SpriteMaterial({ map: texture, depthTest: false })
      const sprite = new THREE.Sprite(material)
      // At the old 0.0025, a typical "12.3 cm" label rendered ~0.75m wide in world space —
      // bigger than most objects being measured. Shrunk to a size that reads as a label,
      // not a billboard.
      const worldUnitsPerPixel = 0.0004
      sprite.scale.set(canvas.width * worldUnitsPerPixel, canvas.height * worldUnitsPerPixel, 1)
      return sprite
    }

    const replaceLabel = (oldLabel, newText, position) => {
      finishedGroup.remove(oldLabel)
      oldLabel.material.map.dispose()
      oldLabel.material.dispose()
      const newLabel = makeTextSprite(newText)
      newLabel.position.copy(position)
      finishedGroup.add(newLabel)
      return newLabel
    }

    const removeMeasurement = (line, label) => {
      finishedGroup.remove(line)
      line.geometry.dispose()
      line.material.dispose()
      finishedGroup.remove(label)
      label.material.map.dispose()
      label.material.dispose()
    }

    // The SLAM-based number is shown immediately, but it's built from IMU/camera scale
    // estimation alone and can be badly wrong (see conversation history). This asks a
    // vision model to look at the actual photo — including the drawn line — for a
    // recognizable object of known real-world size (power socket, coin, keyboard key,
    // etc.) near it, and use that as a scale reference instead. If it can't find one, it's
    // instructed to say so rather than fabricate a number.
    //
    // If the AI can't produce a usable number (network/API failure, or it genuinely found
    // no reference to work from), the whole measurement — line and label — is discarded
    // rather than left showing a possibly-wrong sensor-only value.
    const analyzeWithAi = async (imageDataUrl, slamEstimateCm, line, label, position) => {
      setHint('Checking photo for a size reference…')
      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageDataUrl, slamEstimateCm }),
        })
        const result = await res.json()
        if (result.error) {
          console.error('AI worker error:', result)
          removeMeasurement(line, label)
          setHint(`AI error, measurement discarded: ${result.error}`, 8000)
        } else if (typeof result.estimatedCm === 'number') {
          replaceLabel(label, `${slamEstimateCm.toFixed(1)} cm (AI=${result.estimatedCm.toFixed(1)} cm)`, position)
          const refNote = result.referenceFound
            ? `using ${result.referenceDescription}`
            : 'no reference found — rough guess'
          setHint(`AI estimate (${refNote}): ${result.explanation}`, 12000)
        } else {
          removeMeasurement(line, label)
          setHint(`AI found no reference, measurement discarded: ${result.explanation}`, 10000)
        }
      } catch (err) {
        console.error('AI fetch failed:', err)
        removeMeasurement(line, label)
        setHint(`AI analysis failed, measurement discarded: ${err.message}`, 8000)
      }
    }

    const polylineLengthMeters = (points) => {
      let total = 0
      for (let i = 1; i < points.length; i++) total += points[i].distanceTo(points[i - 1])
      return total
    }

    // The line is always just [start, current] — a straight ruler line from where the
    // drag began to where the finger is now — not a trace of every point passed through.
    let startPoint = null

    const onTouchStart = (e) => {
      e.preventDefault()
      const touch = e.touches[0]
      const hit = hitTestScreenPoint(touch.clientX, touch.clientY)
      if (!hit) return

      startPoint = hit
      activePoints = []
      activeLine = makeLine()
      scene.add(activeLine)
    }

    const onTouchMove = (e) => {
      e.preventDefault()
      if (!activeLine || !startPoint) return
      const touch = e.touches[0]
      const hit = hitTestScreenPoint(touch.clientX, touch.clientY)
      if (!hit) return

      activePoints = [startPoint, hit]
      updateLineGeometry(activeLine, activePoints)
    }

    const onTouchEnd = (e) => {
      e.preventDefault()
      if (!activeLine || activePoints.length < 2 || activePoints[0].distanceTo(activePoints[1]) < 0.005) {
        if (activeLine) scene.remove(activeLine)
        activeLine = null
        activePoints = []
        startPoint = null
        return
      }

      const totalCm = (polylineLengthMeters(activePoints) * 100).toFixed(1)
      const mid = new THREE.Vector3().addVectors(activePoints[0], activePoints[1]).multiplyScalar(0.5)
      const labelPosition = mid.clone()
      labelPosition.y += 0.03 // lift slightly so it doesn't z-fight the line

      const label = makeTextSprite(`${totalCm} cm`)
      label.position.copy(labelPosition)

      const lineMesh = activeLine
      finishedGroup.add(lineMesh)
      finishedGroup.add(label)

      pendingCapture = () => {
        const imageDataUrl = captureDownscaledImage(renderer.domElement, 768)
        analyzeWithAi(imageDataUrl, parseFloat(totalCm), lineMesh, label, labelPosition)
      }

      activeLine = null
      activePoints = []
      startPoint = null
    }

    return {
      name: 'rulerPipelineModule',

      onStart: ({ canvas }) => {
        const { scene: s, camera: c, renderer: r } = XR8.Threejs.xrScene()
        scene = s; camera = c; renderer = r

        scene.add(new THREE.AmbientLight(0xffffff, 1))
        scene.add(finishedGroup)

        // Replaces XRExtras.FullWindowCanvas, which the open-source engine no longer bundles.
        // We don't touch camera.aspect/updateProjectionMatrix ourselves — XR8.XrController
        // owns the three.js camera's projection matrix every frame to match the real device
        // camera's optics, and fighting that sync misplaces anything rendered in the scene.
        //
        // But XrController also needs to be told our actual rendering viewport size via
        // updateCameraProjectionMatrix({cam: {pixelRectWidth, pixelRectHeight, ...}}) — its
        // internal default is 0x0. Without this, hitTest()'s normalized [0,1] coordinates
        // get interpreted against the wrong aspect ratio/FOV, which shows up as distortion
        // that grows toward the screen edges regardless of real-world distance.
        //
        // This is deliberately called ONCE at startup, not on every resize. iOS Safari fires
        // spurious 'resize' events during normal use (address bar show/hide, etc.), and
        // re-running this resets XrController's tracking origin/facing reference each time —
        // that was causing the AR content to flash and intermittently fail to draw.
        renderer.setPixelRatio(window.devicePixelRatio || 1)
        renderer.setSize(window.innerWidth, window.innerHeight)
        XR8.XrController.updateCameraProjectionMatrix({
          cam: {
            pixelRectWidth: canvas.width,
            pixelRectHeight: canvas.height,
            nearClipPlane: 0.01,
            farClipPlane: 1000,
          },
          origin: camera.position,
          facing: camera.quaternion,
        })

        canvas.addEventListener('touchstart', onTouchStart, { passive: false })
        canvas.addEventListener('touchmove', onTouchMove, { passive: false })
        canvas.addEventListener('touchend', onTouchEnd, { passive: false })
      },

      onRender: () => {
        if (!pendingCapture) return
        const capture = pendingCapture
        pendingCapture = null
        capture()
      },
    }
  }

  const onxrloaded = () => {
    XR8.XrController.configure({ disableWorldTracking: false })

    XR8.addCameraPipelineModules([
      XR8.GlTextureRenderer.pipelineModule(),
      XR8.Threejs.pipelineModule(),
      XR8.XrController.pipelineModule(),
      rulerPipelineModule(),
    ])

    XR8.run({
      canvas: document.getElementById('camerafeed'),
      allowedDevices: XR8.XrConfig.device().ANY,
    })
  }

  // iOS Safari blocks accelerometer/gyroscope access (needed for world tracking) until a
  // page explicitly requests it via a user gesture. Gate AR startup behind a tap so this
  // request happens synchronously inside the click handler, as iOS requires.
  document.getElementById('start-button').addEventListener('click', () => {
    document.getElementById('start-overlay').remove()

    const startWhenEngineReady = () => {
      window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)
    }

    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(startWhenEngineReady).catch(startWhenEngineReady)
    } else {
      startWhenEngineReady()
    }
  })
  </script>
</body>
</html>
